<div th:fragment="nowplaying(user, current, upNext)" id="nowplaying-container"
    class="w-[325px] h-[447px] rounded-[21px] bg-stainedglass bg-opacity-40 drop-shadow-xl">
    <div id="nowplaying-inner" class="flex flex-col items-center gap-[27px] mx-[15.5px] my-[26px] w-[294px] h-[395px]">
        <img th:src="${current.albumArt}" class="w-[274px] h-[274px] rounded-[15px]" id="albumArt">
        <span id="nowplayingtext" class="text-justify flex flex-col gap-[27px]">
            <p class="text-center text-[10px]">
                <strong th:text="${user}" id="userName"></strong>
                is playing <strong th:text="${current.title}" id="currentTitle"></strong>
                by <strong th:text="${current.artist}" id="currentArtist"></strong>
            </p>
            <p class="upnext text-center text-[16px]">
                Up Next: <strong th:text="${upNext.title}" class="truncate" id="nextTitle"></strong>
            </p>
        </span>
    </div>
    <script th:inline="javascript" defer>
        const eventReader = new EventSource('/current-sse');
        console.log("EventSource initialized");
        const albumArt = document.getElementById('albumArt');
        const currentTitle = document.getElementById('currentTitle');
        const currentArtist = document.getElementById('currentArtist');
        const nextTitle = document.getElementById('nextTitle');

        eventReader.addEventListener("song_change", (event) => {
            const data = JSON.parse(event.data);
            console.log("Song change event received");

            // Update album art
            albumArt.src = data.currentSong.albumArt;
            // Update current song title and artist
            currentTitle.textContent = data.currentSong.title;
            currentArtist.textContent = data.currentSong.artist;
            // Update next song title
            nextTitle.textContent = data.nextSong.title;
        })

        eventReader.addEventListener("queue_change", (event) => {
            const data = JSON.parse(event.data);
            console.log("Next change event received");

            // Update next song title
            nextTitle.textContent = data.nextSong.title;
        })
    </script>

</div>
