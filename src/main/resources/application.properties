spring.application.name=VestaboardAPI

# Enable or disable LiveReload (enabled by default)
spring.devtools.livereload.enabled=false
logging.level.org.springframework.web=DEBUG
# Disable restart feature (enabled by default)
spring.devtools.restart.enabled=false

# CORS configuration - comma-separated list of allowed origins
# For production, set this to your actual frontend URL(s)
# Example: cors.allowed-origins=https://yourdomain.com,http://localhost:3000
cors.allowed-origins=http://localhost:3000